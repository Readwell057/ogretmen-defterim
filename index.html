<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Öğretmen Defterim</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3B33">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --chalk-dark:#1F3B33;
  --chalk:#28483F;
  --chalk-light:#3E6657;
  --paper:#FBF6EA;
  --paper-2:#F5EEDC;
  --paper-line:#DCD0B4;
  --ink:#232E2B;
  --ink-soft:#5B6B63;
  --gold:#E4B13F;
  --gold-deep:#C9932B;
  --red:#B5473A;
  --red-bg:#F3E1DC;
  --green:#4C7A5B;
  --green-bg:#E1EAE0;
  --radius:12px;
  --shadow:0 2px 14px rgba(15,30,25,0.14);
  --sidebar-w:250px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Manrope',sans-serif;
  color:var(--ink);
  background:var(--chalk-dark);
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--gold);color:var(--chalk-dark);}

/* ---------- LAYOUT ---------- */
#appShell{display:flex;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:linear-gradient(180deg,var(--chalk-dark),#17302A);
  color:#EFEAD8;
  display:flex;
  flex-direction:column;
  padding:22px 14px 14px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
.brand{
  display:flex;align-items:baseline;gap:8px;
  padding:0 8px 18px;
  border-bottom:1px solid rgba(255,255,255,0.12);
  margin-bottom:14px;
}
.brand .mark{
  font-family:'Fraunces',serif;font-weight:700;font-size:26px;
  color:var(--gold);
}
.brand .name{font-size:14.5px;font-weight:600;letter-spacing:.2px;color:#EFEAD8;line-height:1.25;}
.brand .sub{display:block;font-size:11px;font-weight:400;color:#B8C7BE;}

.navlink{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:8px;color:#DCE7DE;
  font-size:14.5px;font-weight:600;text-decoration:none;
  border:none;background:transparent;width:100%;text-align:left;
  margin-bottom:4px;
}
.navlink:hover{background:rgba(255,255,255,0.07);}
.navlink.active{background:var(--gold);color:#1F2A20;}
.navlink .ic{font-size:16px;width:18px;text-align:center;}

.classlist{margin-top:10px;flex:1;overflow-y:auto;}
.classlist-title{
  font-size:11px;text-transform:uppercase;letter-spacing:.09em;
  color:#8FA79A;padding:6px 12px;font-weight:700;
}
.tabitem{
  position:relative;display:flex;align-items:center;gap:9px;
  padding:9px 10px 9px 14px;margin:3px 0 3px 0;border-radius:0 8px 8px 0;
  color:#E7E1CC;text-decoration:none;font-size:14px;font-weight:600;
  border:none;background:transparent;width:100%;text-align:left;
  border-left:4px solid transparent;
}
.tabitem .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.tabitem:hover{background:rgba(255,255,255,0.06);}
.tabitem.active{background:var(--paper);color:var(--ink);border-left-color:var(--gold);}
.tabitem .cnt{margin-left:auto;font-size:11.5px;color:#9FB2A6;font-weight:700;}
.tabitem.active .cnt{color:var(--ink-soft);}

.newclassbtn{
  margin-top:8px;width:100%;padding:9px 12px;border-radius:8px;
  border:1.5px dashed rgba(255,255,255,0.3);background:transparent;
  color:#CFE0D3;font-weight:700;font-size:13.5px;
}
.newclassbtn:hover{border-color:var(--gold);color:var(--gold);}

.sidebar-foot{
  border-top:1px solid rgba(255,255,255,0.12);
  margin-top:12px;padding-top:12px;display:flex;gap:6px;
}
.sidebar-foot button{
  flex:1;background:rgba(255,255,255,0.06);border:none;color:#CFE0D3;
  padding:8px 6px;border-radius:8px;font-size:11.5px;font-weight:700;
}
.sidebar-foot button:hover{background:rgba(255,255,255,0.14);}

.main{
  flex:1;min-width:0;
  background:
    linear-gradient(90deg, transparent 46px, var(--red) 47px, var(--red) 48px, transparent 49px),
    repeating-linear-gradient(var(--paper) 0px, var(--paper) 33px, var(--paper-line) 34px);
  background-attachment:local;
  min-height:100vh;
  padding:26px 30px 60px;
}

.pagehead{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;margin-bottom:18px;
}
.pagehead h1{font-size:26px;margin:0;font-weight:600;color:var(--chalk-dark);}
.pagehead .desc{color:var(--ink-soft);font-size:13.5px;margin-top:2px;}

.card{
  background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px 20px;margin-bottom:16px;border:1px solid #EEE6D2;
}
.grid{display:grid;gap:14px;}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:820px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 16px;border-radius:8px;border:1.5px solid transparent;
  font-weight:700;font-size:13.5px;background:var(--chalk-dark);color:#fff;
}
.btn:hover{background:var(--chalk);}
.btn.gold{background:var(--gold);color:#2A2010;}
.btn.gold:hover{background:var(--gold-deep);}
.btn.outline{background:transparent;border-color:#CFC3A2;color:var(--chalk-dark);}
.btn.outline:hover{background:var(--paper-2);}
.btn.red{background:var(--red);color:#fff;}
.btn.red:hover{background:#96382D;}
.btn.green{background:var(--green);color:#fff;}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
.btn.icon{padding:7px 9px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.pillnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.pillnav button{
  padding:8px 14px;border-radius:20px;border:1.5px solid #DCD0B0;
  background:#fff;color:var(--ink-soft);font-weight:700;font-size:13px;
}
.pillnav button.active{background:var(--chalk-dark);border-color:var(--chalk-dark);color:#fff;}

.studentrow{
  display:flex;align-items:center;gap:10px;padding:9px 6px;
  border-bottom:1px solid var(--paper-line);
}
.studentrow:last-child{border-bottom:none;}
.avatar{
  width:34px;height:34px;border-radius:50%;background:var(--chalk-light);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;
}
.studentname{font-weight:700;font-size:14.5px;flex:1;min-width:0;}
.studentno{color:var(--ink-soft);font-size:12px;}
.badge{font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:20px;}
.badge.plus{background:var(--green-bg);color:var(--green);}
.badge.minus{background:var(--red-bg);color:var(--red);}

.empty{
  text-align:center;padding:38px 20px;color:var(--ink-soft);
}
.empty .big{font-size:34px;margin-bottom:8px;}
.empty h3{margin:0 0 6px;color:var(--chalk-dark);}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:2px solid var(--paper-line);}
td{padding:8px 8px;border-bottom:1px solid var(--paper-line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}

.gradecell{width:56px;padding:7px 4px;border:1.5px solid var(--paper-line);border-radius:7px;background:#fff;font-weight:800;font-size:13.5px;color:var(--ink);}
.gradecell:hover{border-color:var(--gold-deep);}

.formrow{margin-bottom:12px;}
.formrow label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.formrow input,.formrow select,.formrow textarea{
  width:100%;padding:9px 11px;border:1.5px solid #DCD0B0;border-radius:8px;font-size:14px;background:#fff;color:var(--ink);
}
.formrow input:focus,.formrow select:focus,.formrow textarea:focus{outline:none;border-color:var(--gold-deep);}
.formrow textarea{resize:vertical;min-height:70px;}
.formrow small{color:var(--ink-soft);}

.overlay{
  position:fixed;inset:0;background:rgba(20,30,26,0.55);
  display:none;align-items:center;justify-content:center;z-index:100;padding:16px;
}
.overlay.open{display:flex;}
.modal{
  background:var(--paper);border-radius:14px;padding:22px;max-width:460px;width:100%;
  max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.35);
}
.modal h3{margin:0 0 14px;font-size:19px;color:var(--chalk-dark);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;}

.statcard{background:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border:1px solid #EEE6D2;}
.statcard .num{font-family:'Fraunces',serif;font-size:30px;font-weight:700;color:var(--chalk-dark);}
.statcard .lbl{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-top:2px;}

.reminderitem{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--paper-line);}
.reminderitem:last-child{border-bottom:none;}
.reminderitem.done .rtext{text-decoration:line-through;color:var(--ink-soft);}
.rdate{font-size:11.5px;font-weight:800;color:var(--gold-deep);background:#FBF0D6;padding:3px 8px;border-radius:6px;white-space:nowrap;}
.rdate.soon{background:var(--red-bg);color:var(--red);}
.rtext{flex:1;font-size:14px;}

/* KURA */
.kurastage{
  background:var(--chalk-dark);border-radius:16px;padding:40px 20px;text-align:center;color:#fff;margin-bottom:16px;
  background-image:radial-gradient(circle at 50% 0%, #2C5245, var(--chalk-dark) 70%);
}
.kuraresult{font-family:'Fraunces',serif;font-size:40px;font-weight:700;color:var(--gold);min-height:54px;}
.kurasub{color:#B8C7BE;font-size:13px;margin-top:4px;}
.checkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;}
.checkitem{display:flex;align-items:center;gap:7px;font-size:13px;padding:5px 7px;border-radius:7px;background:#fff;border:1px solid var(--paper-line);}
.checkitem.absent{opacity:.45;text-decoration:line-through;}

/* SEATING */
.seatgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 22px;max-width:760px;}
.desk{
  background:#fff;border:1.5px solid var(--paper-line);border-radius:10px;padding:7px;
  display:flex;flex-direction:column;gap:5px;
}
.deskno{font-size:10px;color:var(--ink-soft);font-weight:700;text-align:center;}
.seat{
  border:1.5px dashed #CBBE97;border-radius:7px;padding:7px 6px;font-size:12px;font-weight:700;
  text-align:center;min-height:34px;display:flex;align-items:center;justify-content:center;
  background:var(--paper-2);color:var(--ink);
}
.seat.filled{border-style:solid;border-color:var(--chalk-light);background:#fff;}
.seat.empty-seat{color:#B7AC8C;font-weight:600;}
@media(max-width:700px){.seatgrid{grid-template-columns:repeat(2,1fr);}}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
.toolbar .spacer{flex:1;}
.searchbox{padding:8px 12px;border:1.5px solid #DCD0B0;border-radius:8px;font-size:13.5px;min-width:160px;}

.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--paper-2);color:var(--ink-soft);margin-right:4px;}
.rowactions{display:flex;gap:5px;flex-shrink:0;}
.muted{color:var(--ink-soft);}
.hidden{display:none !important;}

/* NUMPAD */
.numpad-display{font-family:'Fraunces',serif;font-size:40px;text-align:center;padding:14px 0;background:var(--paper-2);border-radius:10px;margin-bottom:12px;color:var(--chalk-dark);min-height:64px;font-weight:700;}
.numpad-progress{text-align:center;color:var(--ink-soft);font-size:12px;margin-bottom:8px;font-weight:700;}
.numpad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.numpad-grid button{padding:16px 0;font-size:19px;font-weight:700;border-radius:10px;border:1.5px solid #DCD0B0;background:#fff;color:var(--ink);}
.numpad-grid button:active{background:var(--paper-2);}
.numpad-actions{display:flex;flex-wrap:wrap;gap:8px;}
.numpad-actions .btn{flex:1;min-width:110px;justify-content:center;}

/* PRINT */
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block !important;position:absolute;top:0;left:0;width:100%;padding:0;background:#fff;}
  #printArea .print-title{display:block;font-family:'Fraunces',serif;font-size:20px;margin-bottom:2px;color:#000;}
  #printArea .print-sub{color:#444;font-size:11px;margin-bottom:14px;}
  @page{size:A4;margin:14mm;}
}
.print-table{width:100%;border-collapse:collapse;font-size:12px;}
.print-table th,.print-table td{border:1px solid #999;padding:5px 7px;text-align:left;}
.print-seatgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.print-desk{border:1px solid #999;border-radius:6px;padding:6px;font-size:11px;min-height:46px;}
.print-desk b{display:block;margin-bottom:3px;font-size:10px;color:#555;}

@media(max-width:900px){
  #appShell{flex-direction:column;}
  .sidebar{
    position:sticky;top:0;width:100%;height:auto;flex-direction:row;align-items:center;
    padding:10px 12px;overflow-x:auto;overflow-y:hidden;z-index:50;
  }
  .brand{border-bottom:none;padding:0 10px 0 0;margin:0;border-right:1px solid rgba(255,255,255,0.15);}
  .classlist{display:flex;flex:none;margin:0 0 0 8px;overflow-x:auto;overflow-y:visible;}
  .classlist-title{display:none;}
  .tabitem{border-radius:8px;border-left:none;border-bottom:3px solid transparent;white-space:nowrap;}
  .tabitem.active{border-bottom-color:var(--gold);}
  .navwrap{display:flex;gap:2px;margin-left:8px;}
  .navlink{white-space:nowrap;margin-bottom:0;padding:8px 10px;}
  .newclassbtn{white-space:nowrap;width:auto;margin:0 0 0 8px;}
  .sidebar-foot{border-top:none;margin:0 0 0 8px;padding:0;}
  .main{padding:16px 14px 40px;}
  .pagehead h1{font-size:21px;}
}
</style>
</head>
<body>
<div id="appShell"></div>
<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>

<script>
/* =========================================================
   ÖĞRETMEN DEFTERİM — veri modeli, localStorage, render
   ========================================================= */
const STORAGE_KEY = 'ogretmenDefteriDB_v1';
const CDN = {
  xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  pdfjs: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfjsWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  tesseract: 'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js',
  mammoth: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js'
};
function loadScript(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = ()=>resolve(); s.onerror = ()=>reject(new Error('Kütüphane yüklenemedi (internet bağlantını kontrol et): ' + src));
    document.head.appendChild(s);
  });
}
function normTr(s){
  return String(s==null?'':s).toLowerCase()
    .replaceAll('İ','i').replaceAll('I','i').replaceAll('ı','i')
    .replaceAll('ş','s').replaceAll('ğ','g').replaceAll('ü','u').replaceAll('ö','o').replaceAll('ç','c')
    .trim();
}
const COLORS = ['#E4B13F','#4C7A5B','#B5473A','#3E6657','#8B6BB5','#4C7CA8','#C9862B','#6B8E4E'];
const DAYS = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const DAY_BY_JS = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const GRADE_FIELDS = ['sinav1','sinav2','sozlu1','sozlu2'];
const GRADE_LABELS = {sinav1:'Sınav 1', sinav2:'Sınav 2', sozlu1:'Sözlü 1', sozlu2:'Sözlü 2'};

let db = loadDB();
migrateDB();
let state = { view:'home', classId:null, classTab:'ogrenciler', kuraPicked:[], kuraLastId:null, kuraAbsent:{}, search:'', rankSort:'desc', homeSort:'desc', numpad:null, studentSort:'number' };
let lastQuickAction = {};

function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { classes: [], schedule: [] };
}
function saveDB(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    return true;
  }catch(e){
    console.error('saveDB failed', e);
    alert('Veri kaydedilemedi! Tablet hafızası dolmuş olabilir.\n\nÖneri: Sol menüden "Yedekle" ile hemen bir yedek al, sonra Ayarlar > Uygulamalar > Chrome/Defterim > Depolama kısmından "Önbelleği temizle" dene (veriler "Geri Yükle" ile geri gelir).\n\nTeknik detay: ' + (e && e.message ? e.message : e));
    return false;
  }
}

function migrateDB(){
  let changed = false;
  if(!Array.isArray(db.classes)) { db.classes = []; changed = true; }
  if(!Array.isArray(db.schedule)) { db.schedule = []; changed = true; }
  db.classes.forEach(c=>{
    if(!Array.isArray(c.notes)) { c.notes = []; changed = true; }
    if(!Array.isArray(c.reminders)) { c.reminders = []; changed = true; }
    if(!Array.isArray(c.behavior)) { c.behavior = []; changed = true; }
    if(!Array.isArray(c.seating) || c.seating.length!==20){ c.seating = Array.from({length:20},()=>[null,null]); changed = true; }
    c.students.forEach(s=>{
      if(!s.grades){
        s.grades = {sinav1:null, sinav2:null, sozlu1:null, sozlu2:null};
        if(Array.isArray(c.grades)){
          const exams = c.grades.filter(g=>g.studentId===s.id && g.type==='sinav').sort((a,b)=>a.date.localeCompare(b.date));
          const orals = c.grades.filter(g=>g.studentId===s.id && g.type==='sozlu').sort((a,b)=>a.date.localeCompare(b.date));
          if(exams[0]) s.grades.sinav1 = exams[0].value;
          if(exams[1]) s.grades.sinav2 = exams[1].value;
          if(orals[0]) s.grades.sozlu1 = orals[0].value;
          if(orals[1]) s.grades.sozlu2 = orals[1].value;
        }
        changed = true;
      }
    });
  });
  if(changed) saveDB();
}

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function todayDayName(){ return DAY_BY_JS[new Date().getDay()]; }
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function daysUntil(iso){
  const today = new Date(todayISO());
  const target = new Date(iso);
  return Math.round((target-today)/86400000);
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function getClass(id){ return db.classes.find(c=>c.id===id); }
function classColor(cls){ return cls.color || COLORS[db.classes.indexOf(cls) % COLORS.length]; }
function initials(name){ return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function newClassObj(name){
  return {
    id: uid(), name, color: COLORS[db.classes.length % COLORS.length], createdAt: todayISO(),
    students: [], behavior: [], notes: [], reminders: [],
    seating: Array.from({length:20}, ()=>[null,null])
  };
}
function studentAvg(s){
  const vals = GRADE_FIELDS.map(k=>s.grades[k]).filter(v=>v!=null && v!=='');
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function classAvg(cls){
  const vals = cls.students.map(s=>studentAvg(s)).filter(v=>v!=null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function gradeQueue(cls, onlyStudentId){
  const students = [...cls.students].sort((a,b)=>a.name.localeCompare(b.name,'tr'));
  const q = [];
  students.forEach(s=>{
    if(onlyStudentId && s.id!==onlyStudentId) return;
    GRADE_FIELDS.forEach(f=>q.push({studentId:s.id, field:f}));
  });
  return q;
}

/* =========================================================
   ÖĞRENCİ LİSTESİ İÇE AKTARMA (Excel / PDF / Fotoğraf)
   ========================================================= */
async function parseExcelFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
}
function excelRowsToLines(rows){
  let headerIdx = -1, noCol = -1, adCol = -1, soyadCol = -1, adSoyadCol = -1;
  for(let i=0; i<Math.min(rows.length,10); i++){
    const row = rows[i]; if(!row) continue;
    let found = false;
    row.forEach((cell,ci)=>{
      const n = normTr(cell); if(!n) return;
      if(n.includes('ogrenci') && n.includes('no')){ noCol=ci; found=true; }
      else if(noCol===-1 && (n==='no' || n==='numara' || n==='okul no' || n==='s.no')){ noCol=ci; }
      if(n.includes('ad') && n.includes('soyad')){ adSoyadCol=ci; found=true; }
      else if(n==='ad' || n==='adi'){ adCol=ci; found=true; }
      if(n.includes('soyad')){ soyadCol=ci; found=true; }
    });
    if(found){ headerIdx=i; break; }
  }
  const dataRows = headerIdx>=0 ? rows.slice(headerIdx+1) : rows;
  const lines = [];
  dataRows.forEach(row=>{
    if(!row || row.every(c=>String(c).trim()==='')) return;
    let name='', no='';
    if(adSoyadCol>=0) name = String(row[adSoyadCol]||'').trim();
    else if(adCol>=0 || soyadCol>=0) name = [row[adCol]||'', row[soyadCol]||''].map(x=>String(x).trim()).filter(Boolean).join(' ');
    if(noCol>=0) no = String(row[noCol]||'').trim();
    if(!name){
      const textCells = row.filter(c=>c!=='' && isNaN(Number(c)));
      name = textCells.join(' ').trim();
      const numCells = row.filter(c=>c!=='' && !isNaN(Number(c)) && String(c).trim()!=='');
      if(!no && numCells.length) no = String(numCells[numCells.length-1]).trim();
    }
    if(name) lines.push(no ? `${no} - ${name}` : name);
  });
  return lines;
}
function joinPdfRowItems(items){
  let text = '';
  for(let i=0; i<items.length; i++){
    const it = items[i];
    if(i>0){
      const prev = items[i-1];
      const prevEnd = prev.transform[4] + (prev.width || 0);
      const gap = it.transform[4] - prevEnd;
      const threshold = Math.max(1, (it.height || prev.height || 10) * 0.22);
      if(gap > threshold) text += ' ';
    }
    text += it.str;
  }
  return text.replace(/\s+/g,' ').trim();
}
async function parsePdfFile(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const lines = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const rowsMap = {};
    content.items.forEach(it=>{
      const y = Math.round(it.transform[5]/3)*3;
      if(!rowsMap[y]) rowsMap[y]=[];
      rowsMap[y].push(it);
    });
    Object.keys(rowsMap).map(Number).sort((a,b)=>b-a).forEach(y=>{
      const sorted = rowsMap[y].sort((a,b)=>a.transform[4]-b.transform[4]);
      const text = joinPdfRowItems(sorted);
      if(text) lines.push(text);
    });
  }
  return lines;
}
async function parseDocxFile(file){
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({arrayBuffer: buf});
  return result.value.split('\n').map(l=>l.trim()).filter(Boolean);
}
async function parseImageFile(file, onProgress){
  const result = await Tesseract.recognize(file, 'tur', { logger: onProgress });
  return result.data.text.split('\n').map(l=>l.trim()).filter(Boolean);
}
function rawLineToEntry(line){
  const nums = line.match(/\d+/g) || [];
  const no = nums.length>=2 ? nums[1] : (nums.length===1 ? nums[0] : '');
  const name = line.replace(/\d+/g,'').replace(/\b(erkek|kız|kiz|kadın|kadin|bay|bayan|e|k)\b/gi,'').replace(/\s+/g,' ').trim();
  if(!name || name.length<2) return null;
  return no ? `${no} - ${name}` : name;
}
function linesToEntries(lines){ return lines.map(rawLineToEntry).filter(Boolean); }

            <span class="rtext">${escapeHtml(s?s.name:'Silinmiş öğrenci')} ${b.note?`— ${escapeHtml(b.note)}`:''} <span class="tag">${fmtDate(b.date)}</span></span>

          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

/* ---------- SIRALAMA ---------- */
function renderTabRanking(cls){

    <div class="card">
      <div class="toolbar">
        <h3 style="margin:0;">Başarı Sıralaması</h3>
        <div class="spacer"></div>
        <button class="btn ${dir==='desc'?'gold':'outline'} sm" data-action="setRankSort" data-dir="desc">Başarılı → Başarısız</button>
        <button class="btn ${dir==='asc'?'gold':'outline'} sm" data-action="setRankSort" data-dir="asc">Başarısız → Başarılı</button>
      </div>
      ${list.length===0? `<p class="muted">Öğrenci yok.</p>` : list.map((item,i)=>`
        <div class="reminderitem">
          <b style="width:22px;">${i+1}.</b>
          <div class="avatar" style="background:${classColor(cls)};width:30px;height:30px;font-size:11px;">${initials(item.s.name)}</div>

}

/* =========================================================
   ÖĞRENCİ PROFİLİ
   ========================================================= */
function renderStudentProfile(cls, s){
  const plus = cls.behavior.filter(b=>b.studentId===s.id && b.type==='+').length;
  const minus = cls.behavior.filter(b=>b.studentId===s.id && b.type==='-').length;
  const avg = studentAvg(s);
  let deskNo=null, seatSlot=null;
  cls.seating.forEach((d,i)=>{ d.forEach((sid,slot)=>{ if(sid===s.id){ deskNo=i+1; seatSlot=slot+1; } }); });
  const recentBehavior = cls.behavior.filter(b=>b.studentId===s.id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  return `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
      <div class="avatar" style="width:48px;height:48px;font-size:17px;background:${classColor(cls)}">${initials(s.name)}</div>
      <div>
        <h3 style="margin:0;">${escapeHtml(s.name)}</h3>
        <div class="muted">${s.number?`No: ${s.number} · `:''}${escapeHtml(cls.name)}</div>
      </div>
    </div>
    <div class="grid cols-3" style="margin-bottom:14px;">
      <div class="statcard"><div class="num" style="color:var(--green)">${plus}</div><div class="lbl">Artı (+)</div></div>
      <div class="statcard"><div class="num" style="color:var(--red)">${minus}</div><div class="lbl">Eksi (−)</div></div>
      <div class="statcard"><div class="num">${avg==null?'—':avg.toFixed(1)}</div><div class="lbl">Genel Ortalama</div></div>
    </div>
    <h4 style="margin:0 0 6px;">Notlar (dokunup değiştirebilirsin)</h4>
    <table style="margin-bottom:14px;">
      <tr><th>Sınav 1</th><th>Sınav 2</th><th>Sözlü 1</th><th>Sözlü 2</th></tr>
      <tr>
        ${GRADE_FIELDS.map(f=>`<td><button class="gradecell" data-action="openGradeCellSingle" data-id="${cls.id}" data-sid="${s.id}" data-field="${f}">${s.grades[f]==null?'—':s.grades[f]}</button></td>`).join('')}
      </tr>
    </table>
    <h4 style="margin:0 0 6px;">Oturma Yeri</h4>
    <p class="muted" style="margin-top:0;">${deskNo? `Masa ${deskNo}, Koltuk ${seatSlot}` : 'Henüz yerleştirilmedi'}</p>
    <h4 style="margin:0 0 6px;">Son +/− Kayıtları</h4>
    ${recentBehavior.length===0? '<p class="muted">Kayıt yok.</p>' : recentBehavior.map(b=>`
      <div class="reminderitem">
        <span class="badge ${b.type==='+'?'plus':'minus'}">${b.type}</span>
        <span class="rtext">${escapeHtml(b.note||'—')} <span class="tag">${fmtDate(b.date)}</span></span>
      </div>`).join('')}
    <div class="modal-actions">
      <button class="btn outline" data-action="closeModal">Kapat</button>
      <button class="btn gold" data-action="printReportCard" data-id="${cls.id}" data-sid="${s.id}">🖨️ Karneyi Yazdır / PDF</button>
    </div>
  `;
}

/* =========================================================
   NUMPAD (Sınav/Sözlü not girişi — dokunmatik tuş takımı)
   ========================================================= */
function numpadCurrentValueString(){
  const st = state.numpad; const cls = getClass(st.clsId); const item = st.queue[st.idx];
  const s = cls.students.find(s=>s.id===item.studentId);
  const v = s.grades[item.field];
  return v==null ? '' : String(v);
}
function numpadCommit(){
  const st = state.numpad; const cls = getClass(st.clsId); const item = st.queue[st.idx];
  const s = cls.students.find(s=>s.id===item.studentId);
  const v = st.value.trim();
  if(v===''){ s.grades[item.field] = null; }
  else{
    let n = Number(v);
    if(isNaN(n)) n = null; else n = Math.max(0, Math.min(100, n));
    s.grades[item.field] = n;
  }
  saveDB();
}
function renderNumpadModal(){
  const st = state.numpad;
  const cls = getClass(st.clsId);
  const item = st.queue[st.idx];
  const student = cls.students.find(s=>s.id===item.studentId);
  const isBulk = st.queue.length>1;
  return `
    <h3 style="margin-bottom:2px;">${escapeHtml(student.name)}</h3>
    <div class="muted" style="margin-bottom:8px;">${GRADE_LABELS[item.field]} · not (0-100)</div>
    ${isBulk? `<div class="numpad-progress">${st.idx+1} / ${st.queue.length}</div>` : ''}
    <div class="numpad-display">${st.value===''? '—' : st.value}</div>
    <div class="numpad-grid">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-action="numpadDigit" data-d="${n}">${n}</button>`).join('')}
      <button data-action="numpadClear">Temizle</button>
      <button data-action="numpadDigit" data-d="0">0</button>
      <button data-action="numpadBack">⌫</button>
    </div>
    <div class="numpad-actions">
      <button class="btn outline" data-action="numpadCancel">Vazgeç</button>
      ${st.idx>0? `<button class="btn outline" data-action="numpadPrev">◀ Önceki</button>` : ''}
      <button class="btn outline" data-action="numpadSaveClose">Kaydet & Kapat</button>
      <button class="btn gold" data-action="numpadNext">${st.idx < st.queue.length-1? 'Kaydet & Sonraki ▶' : 'Kaydet & Bitir'}</button>
    </div>
  `;
}

/* =========================================================
   ACTIONS
   ========================================================= */
function handleAction(ds, ev){
  const a = ds.action;
  const cls = ds.id ? getClass(ds.id) : null;
  switch(a){
    case 'goHome': state.view='home'; state.search=''; render(); break;
    case 'goSchedule': state.view='schedule'; render(); break;
    case 'openClass': state.view='class'; state.classId=ds.id; state.classTab='ogrenciler'; state.search=''; state.kuraPicked=[]; state.kuraLastId=null; state.kuraAbsent={}; render(); break;
    case 'setClassTab': state.classTab=ds.tab; state.search=''; renderMain(); break;
    case 'setRankSort': state.rankSort=ds.dir; renderMain(); break;
    case 'setHomeSort': state.homeSort=ds.dir; renderMain(); break;
    case 'setStudentSort': state.studentSort=ds.mode; renderMain(); break;

    case 'newClass': return openModal(`
      <h3>Yeni Sınıf</h3>
      <form data-action="submitNewClass">
        <div class="formrow"><label>Sınıf adı</label><input name="name" placeholder="Örn: 6-A Matematik" required></div>
        <div class="modal-actions"><button type="button" class="btn outline" data-action="closeModal">Vazgeç</button><button type="submit" class="btn gold">Oluştur</button></div>
      </form>`);
    case 'renameClass': return openModal(`
      <h3>Sınıfı Düzenle</h3>
      <form data-action="submitRenameClass" data-id="${cls.id}">
        <div class="formrow"><label>Sınıf adı</label><input name="name" value="${escapeHtml(cls.name)}" required></div>
        <div class="modal-actions"><button type="button" class="btn outline" data-action="closeModal">Vazgeç</button><button type="submit" class="btn gold">Kaydet</button></div>
      </form>`);
    case 'deleteClass':
      if(confirm(`"${cls.name}" sınıfını ve tüm verilerini silmek istediğine emin misin?`)){
        db.classes = db.classes.filter(c=>c.id!==cls.id); saveDB(); state.view='home'; render();
      } break;

    case 'addStudent': return openModal(`
      <h3>Öğrenci Ekle</h3>
      <form data-action="submitAddStudent" data-id="${cls.id}">
        <div class="formrow"><label>Ad Soyad</label><input name="name" required></div>
        <div class="formrow"><label>Numara (opsiyonel)</label><input name="number" type="number"></div>
        <div class="modal-actions"><button type="button" class="btn outline" data-action="closeModal">Vazgeç</button><button type="submit" class="btn gold">Ekle</button></div>
      </form>`);
    case 'editStudent': {
      const s = cls.students.find(s=>s.id===ds.sid);
      return openModal(`
        <h3>Öğrenciyi Düzenle</h3>
        <form data-action="submitEditStudent" data-id="${cls.id}" data-sid="${s.id}">
          <div class="formrow"><label>Ad Soyad</label><input name="name" value="${escapeHtml(s.name)}" required></div>
          <div class="formrow"><label>Numara</label><input name="number" type="number" value="${s.number||''}"></div>
          <div class="modal-actions"><button type="button" class="btn outline" data-action="closeModal">Vazgeç</button><button type="submit" class="btn gold">Kaydet</button></div>
        </form>`);
    }
    case 'deleteStudent':
      if(confirm('Bu öğrenciyi silmek istediğine emin misin? (+/- ve not kayıtları da silinir)')){
        cls.students = cls.students.filter(s=>s.id!==ds.sid);
        cls.behavior = cls.behavior.filter(b=>b.studentId!==ds.sid);
        cls.seating = cls.seating.map(d=>d.map(x=>x===ds.sid?null:x));
        saveDB(); renderMain();
      } break;
    case 'searchStudents': state.search = ev.target.value; renderMain(); break;

    case 'openProfile': {
      const s = cls.students.find(s=>s.id===ds.sid);
      return openModal(renderStudentProfile(cls, s));
    }

    case 'quickBehavior': {
      const key = ds.sid + ds.type;
      const now = Date.now();
      if(lastQuickAction[key] && now - lastQuickAction[key] < 600) break;
      lastQuickAction[key] = now;
      cls.behavior.push({id:uid(), studentId:ds.sid, type:ds.type, date:todayISO(), note:''});
      saveDB(); renderMain(); break;
    }
    case 'behaviorHistory': {
      const s = cls.students.find(s=>s.id===ds.sid);
      const rows = cls.behavior.filter(b=>b.studentId===s.id).sort((a,b)=>b.date.localeCompare(a.date));
      return openModal(`
        <h3>${escapeHtml(s.name)} — Geçmiş</h3>
        <div class="formrow" style="display:flex;gap:8px;">
          <input id="behNote" placeholder="Not (opsiyonel)" style="flex:1;padding:9px 11px;border:1.5px solid #DCD0B0;border-radius:8px;">
        </div>
        <div class="modal-actions" style="justify-content:flex-start;margin-top:-4px;margin-bottom:14px;">
          <button class="btn green sm" data-action="addBehaviorWithNote" data-id="${cls.id}" data-sid="${s.id}" data-type="+">+ Ekle</button>
          <button class="btn red sm" data-action="addBehaviorWithNote" data-id="${cls.id}" data-sid="${s.id}" data-type="-">− Ekle</button>
        </div>
        ${rows.length===0?'<p class="muted">Kayıt yok.</p>':rows.map(b=>`
          <div class="reminderitem">
            <span class="badge ${b.type==='+'?'plus':'minus'}">${b.type}</span>
            <span class="rtext">${escapeHtml(b.note||'—')} <span class="tag">${fmtDate(b.date)}</span></span>
            <button class="btn outline sm icon" data-action="deleteBehaviorInModal" data-id="${cls.id}" data-bid="${b.id}" data-sid="${s.id}">✕</button>
          </div>`).join('')}
        <div class="modal-actions"><button class="btn outline" data-action="closeModal">Kapat</button></div>
      `);
    }
    case 'addBehaviorWithNote': {
      const noteEl = document.getElementById('behNote');
      const note = noteEl ? noteEl.value.trim() : '';
      cls.behavior.push({id:uid(), studentId:ds.sid, type:ds.type, date:todayISO(), note});
      saveDB();
      handleAction({action:'behaviorHistory', id:ds.id, sid:ds.sid});
      break;
    }
    case 'deleteBehavior':
      cls.behavior = cls.behavior.filter(b=>b.id!==ds.bid); saveDB(); renderMain(); break;
    case 'deleteBehaviorInModal':
      cls.behavior = cls.behavior.filter(b=>b.id!==ds.bid); saveDB();
      handleAction({action:'behaviorHistory', id:ds.id, sid:ds.sid}); break;

    case 'kuraDraw': {
      const present = cls.students.filter(s=>!state.kuraAbsent[s.id]);
      let pool = present.filter(s=> !state.kuraPicked.includes(s.id));
      if(pool.length===0){ pool = present; state.kuraPicked = []; }
      const pick = pool[Math.floor(Math.random()*pool.length)];
      state.kuraLastId = pick.id;
      state.kuraPicked.push(pick.id);
      renderMain(); break;
    }
    case 'kuraReset': state.kuraPicked=[]; state.kuraLastId=null; renderMain(); break;
    case 'toggleAbsent': state.kuraAbsent[ds.sid] = !state.kuraAbsent[ds.sid]; renderMain(); break;

    case 'addLessonNote': return openModal(`
      <h3>Ders Notu Ekle</h3>
      <form data-action="submitLessonNote" data-id="${cls.id}">
        <div class="formrow"><label>Tarih</label><input name="date" type="date" value="${todayISO()}" required></div>
        <div class="formrow"><label>İşlenen konu / not</label><textarea name="text" required placeholder="Bugün ne işlendi, ödev, hatırlatma..."></textarea></div>
        <div class="modal-actions"><button type="button" class="btn outline" data-action="closeModal">Vazgeç</button><button type="submit" class="btn gold">Kaydet</button></div>
      </form>`);
    case 'editLessonNote': {
      const n = cls.notes.find(n=>n.id===ds.nid);
      return openModal(`
        <h3>Notu Düzenle</h3>
        <form data-action="submitEditLessonNote" data-id="${cls.id}" data-nid="${n.id}">
          <div class="formrow"><label>Tarih</label><input name="date" type="date" value="${n.date}" required></div>
          <div class="formrow"><label>Not</label><textarea name="text" required>${escapeHtml(n.text)}</textarea></div>
          <div class="modal-actions"><button type="button" class="btn outline" data-action="closeModal">Vazgeç</button><button type="submit" class="btn gold">Kaydet</button></div>
        </form>`);
    }
    case 'deleteLessonNote': cls.notes = cls.notes.filter(n=>n.id!==ds.nid); saveDB(); renderMain(); break;

    /* ---- Not girişi (tuş takımı) ---- */
    case 'openGradeCell': {
      const queue = gradeQueue(cls, null);
      const idx = queue.findIndex(q=>q.studentId===ds.sid && q.field===ds.field);
      state.numpad = { clsId: cls.id, queue, idx, value:'', onDone:null };
      state.numpad.value = numpadCurrentValueString();
      return openModal(renderNumpadModal());
    }
    case 'startBulkGrades': {
      const queue = gradeQueue(cls, null);
      if(queue.length===0) break;
      state.numpad = { clsId: cls.id, queue, idx:0, value:'', onDone:null };
      state.numpad.value = numpadCurrentValueString();
      return openModal(renderNumpadModal());
    }
    case 'openGradeCellSingle': {
      const queue = gradeQueue(cls, ds.sid);
      const idx = queue.findIndex(q=>q.field===ds.field);
      state.numpad = { clsId: cls.id, queue, idx, value:'', onDone: {action:'openProfile', id:cls.id, sid:ds.sid} };
      state.numpad.value = numpadCurrentValueString();
      return openModal(renderNumpadModal());
    }
    case 'numpadDigit': {
      const st = state.numpad; if(st.value.length<3) st.value += ds.d;
      return openModal(renderNumpadModal());
    }
    case 'numpadBack': state.numpad.value = state.numpad.value.slice(0,-1); return openModal(renderNumpadModal());
    case 'numpadClear': state.numpad.value = ''; return openModal(renderNumpadModal());
    case 'numpadCancel': {
      const onDone = state.numpad.onDone; state.numpad=null; closeModal();
      if(onDone) handleAction(onDone); else renderMain();
      break;
    }
    case 'numpadPrev': {
      numpadCommit();
      const st = state.numpad;
      if(st.idx>0){ st.idx--; st.value = numpadCurrentValueString(); return openModal(renderNumpadModal()); }
      break;
    }
    case 'numpadNext': {
      numpadCommit();
      const st = state.numpad;
      if(st.idx < st.queue.length-1){ st.idx++; st.value = numpadCurrentValueString(); return openModal(renderNumpadModal()); }
      const onDone = st.onDone; state.numpad=null; closeModal();
      if(onDone) handleAction(onDone); else renderMain();
      break;
    }
    case 'numpadSaveClose': {
      numpadCommit();
      const onDone = state.numpad.onDone; state.numpad=null; closeModal();
      if(onDone) handleAction(onDone); else renderMain();
      break;
    }

    case 'seatClick': {
      const desk = cls.seating[ds.desk]; const slot = Number(ds.slot);
      const current = desk[slot];
      const assignedIds = new Set(cls.seating.flat().filter(Boolean));
      const available = cls.students.filter(s=> !assignedIds.has(s.id) || s.id===current);
      return openModal(`
        <h3>Masa ${Number(ds.desk)+1} — Koltuk ${slot+1}</h3>
        <form data-action="submitSeat" data-id="${cls.id}" data-desk="${ds.desk}" data-slot="${slot}">
          <div class="formrow"><label>Öğrenci</label>
            <select name="studentId">
              <option value="">— Boş bırak —</option>
              ${available.sort((a,b)=>a.name.localeCompare(b.name,'tr')).map(s=>`<option value="${s.id}" ${s.id===current?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
            </select>
          </div>
          <div class="modal-actions"><button type="button" class="btn outline" data-action="closeModal">Vazgeç</button><button type="submit" class="btn gold">Kaydet</button></div>
        </form>`);
    }
    case 'seatingShuffle': {
      const shuffled = [...cls.students].sort(()=>Math.random()-0.5);
      const seating = Array.from({length:20}, ()=>[null,null]);
      let i=0;
      for(let d=0; d<20 && i<shuffled.length; d++){
        seating[d][0] = shuffled[i] ? shuffled[i++].id : null;
        if(i<shuffled.length){ seating[d][1] = shuffled[i++].id; }
      }
      cls.seating = seating; saveDB(); renderMain(); break;
    }
    case 'seatingClear':
      if(confirm('Oturma düzenini temizlemek istediğine emin misin?')){
        cls.seating = Array.from({length:20}, ()=>[null,null]); saveDB(); renderMain();
      } break;

    case 'addReminder': return openModal(`
      <h3>Hatırlatıcı Ekle</h3>
      <form data-action="submitReminder" data-id="${cls.id}">
        <div class="formrow"><label>Tarih</label><input name="date" type="date" value="${todayISO()}" required></div>
        <div class="formrow"><label>Hatırlatıcı</label><input name="text" required placeholder="Örn: Gelecek hafta sınav var"></div>
        <div class="modal-actions"><button type="button" class="btn outline" data-action="closeModal">Vazgeç</button><button type="submit" class="btn gold">Kaydet</button></div>
      </form>`);
    case 'toggleReminder': { const r = cls.reminders.find(r=>r.id===ds.rid); r.done = !r.done; saveDB(); renderMain(); break; }
    case 'deleteReminder': cls.reminders = cls.reminders.filter(r=>r.id!==ds.rid); saveDB(); renderMain(); break;

    /* ---- Ders Programı ---- */
    case 'addScheduleItem': return openModal(`
      <h3>Ders Ekle</h3>
      <form data-action="submitScheduleItem">
        <div class="formrow"><label>Gün</label><select name="day">${DAYS.map(d=>`<option>${d}</option>`).join('')}</select></div>
        <div class="formrow"><label>Saat</label><input name="time" type="time" required></div>
        <div class="formrow"><label>Sınıf</label><select name="classId" required>
          ${db.classes.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}
        </select></div>
        <div class="modal-actions"><button type="button" class="btn outline" data-action="closeModal">Vazgeç</button><button type="submit" class="btn gold">Ekle</button></div>
      </form>`);
    case 'deleteScheduleItem': db.schedule = db.schedule.filter(x=>x.id!==ds.sched); saveDB(); renderMain(); break;

    /* ---- Yazdır / PDF ---- */
    case 'printStudentList': {
      const students = [...cls.students].sort((a,b)=>{
        if(state.studentSort==='alpha') return a.name.localeCompare(b.name,'tr');
        return (a.number??9999)-(b.number??9999) || a.name.localeCompare(b.name,'tr');
      });
      const body = `<table class="print-table"><tr><th>#</th><th>Ad Soyad</th><th>+</th><th>−</th></tr>
        ${students.map(s=>{
          const p = cls.behavior.filter(b=>b.studentId===s.id&&b.type==='+').length;
          const m = cls.behavior.filter(b=>b.studentId===s.id&&b.type==='-').length;
          return `<tr><td>${s.number||''}</td><td>${escapeHtml(s.name)}</td><td>${p}</td><td>${m}</td></tr>`;
        }).join('')}</table>`;
      openPrintView(`${escapeHtml(cls.name)} — Sınıf Listesi`, `${fmtDate(todayISO())} · ${students.length} öğrenci`, body);
      break;
    }
    case 'printGradeSheet': {
      const students = [...cls.students].sort((a,b)=>a.name.localeCompare(b.name,'tr'));
      const body = `<table class="print-table"><tr><th>Ad Soyad</th><th>Sınav 1</th><th>Sınav 2</th><th>Sözlü 1</th><th>Sözlü 2</th><th>Ortalama</th></tr>
        ${students.map(s=>{
          const avg = studentAvg(s);
          return `<tr><td>${escapeHtml(s.name)}</td><td>${s.grades.sinav1??''}</td><td>${s.grades.sinav2??''}</td><td>${s.grades.sozlu1??''}</td><td>${s.grades.sozlu2??''}</td><td><b>${avg==null?'':avg.toFixed(1)}</b></td></tr>`;
        }).join('')}</table>`;
      openPrintView(`${escapeHtml(cls.name)} — Not Çizelgesi`, `${fmtDate(todayISO())}`, body);
      break;
    }
    case 'printBehaviorReport': {
      const students = [...cls.students].sort((a,b)=>a.name.localeCompare(b.name,'tr'));
      const body = `<table class="print-table"><tr><th>Ad Soyad</th><th>+</th><th>−</th><th>Net</th></tr>
        ${students.map(s=>{
          const p = cls.behavior.filter(b=>b.studentId===s.id&&b.type==='+').length;
          const m = cls.behavior.filter(b=>b.studentId===s.id&&b.type==='-').length;
          return `<tr><td>${escapeHtml(s.name)}</td><td>${p}</td><td>${m}</td><td>${p-m}</td></tr>`;
        }).join('')}</table>`;
      openPrintView(`${escapeHtml(cls.name)} — Davranış (+/−) Raporu`, `${fmtDate(todayISO())}`, body);
      break;
    }
    case 'printSeating': {
      const body = `<div class="print-seatgrid">
        ${cls.seating.map((d,i)=>`<div class="print-desk"><b>Masa ${i+1}</b>${d.map(sid=>{const s=cls.students.find(s=>s.id===sid); return `<div>${s?escapeHtml(s.name):'—'}</div>`;}).join('')}</div>`).join('')}
      </div>`;
      openPrintView(`${escapeHtml(cls.name)} — Oturma Düzeni`, `${fmtDate(todayISO())} · 4 sıra × 5 sıra (20 masa, masa başı 2 kişi)`, body);
      break;
    }
    case 'printReportCard': {
      const s = cls.students.find(s=>s.id===ds.sid);
      const avg = studentAvg(s);
      const p = cls.behavior.filter(b=>b.studentId===s.id&&b.type==='+').length;
      const m = cls.behavior.filter(b=>b.studentId===s.id&&b.type==='-').length;
      let deskNo=null; cls.seating.forEach((d,i)=>{ if(d.includes(s.id)) deskNo=i+1; });
      const body = `
        <table class="print-table" style="margin-bottom:14px;">
          <tr><th>Sınav 1</th><th>Sınav 2</th><th>Sözlü 1</th><th>Sözlü 2</th><th>Ortalama</th></tr>
          <tr><td>${s.grades.sinav1??'—'}</td><td>${s.grades.sinav2??'—'}</td><td>${s.grades.sozlu1??'—'}</td><td>${s.grades.sozlu2??'—'}</td><td><b>${avg==null?'—':avg.toFixed(1)}</b></td></tr>
        </table>
        <table class="print-table">
          <tr><th>Artı (+)</th><th>Eksi (−)</th><th>Oturma Yeri</th></tr>
          <tr><td>${p}</td><td>${m}</td><td>${deskNo?`Masa ${deskNo}`:'—'}</td></tr>
        </table>`;
      openPrintView(`${escapeHtml(s.name)} — Karne / Özet`, `${escapeHtml(cls.name)} · ${fmtDate(todayISO())}`, body);
      break;
    }

    case 'openImport': return openModal(renderImportModal(cls));
    case 'importFileSelected': {
      const input = document.getElementById('importFileInput');
      const file = input && input.files[0];
      if(!file) break;
      const statusEl = document.getElementById('importStatus');
      const taEl = document.getElementById('importTextarea');
      const ext = file.name.split('.').pop().toLowerCase();
      (async ()=>{
        try{
          let lines = [];
          const excelExts = ['xlsx','xls','csv'];
          const imageExts = ['jpg','jpeg','png','webp','bmp','gif'];
          if(excelExts.includes(ext)){
            statusEl.textContent = 'Excel okunuyor...';
            await loadScript(CDN.xlsx);
            const rows = await parseExcelFile(file);
            lines = excelRowsToLines(rows);
          } else if(ext==='pdf'){
            statusEl.textContent = 'PDF okunuyor...';
            await loadScript(CDN.pdfjs);
            pdfjsLib.GlobalWorkerOptions.workerSrc = CDN.pdfjsWorker;
            lines = linesToEntries(await parsePdfFile(file));
          } else if(ext==='docx'){
            statusEl.textContent = 'Word belgesi okunuyor...';
            await loadScript(CDN.mammoth);
            lines = linesToEntries(await parseDocxFile(file));
          } else if(ext==='doc'){
            statusEl.textContent = 'Eski .doc formatı tarayıcıda okunamıyor. Dosyayı Word\'de açıp ".docx" veya "PDF" olarak farklı kaydedip tekrar dene — ya da listeyi kopyalayıp aşağıdaki kutuya yapıştır.';
            return;
          } else if(imageExts.includes(ext)){
            statusEl.textContent = 'Fotoğraf yükleniyor (Türkçe dil verisi ilk seferde biraz sürebilir)...';
            await loadScript(CDN.tesseract);
            const rawLines = await parseImageFile(file, (m)=>{
              if(m.status==='recognizing text') statusEl.textContent = `Fotoğraf okunuyor... %${Math.round(m.progress*100)}`;
            });
            lines = linesToEntries(rawLines);
          } else {
            statusEl.textContent = 'Bu dosya türü desteklenmiyor. Excel (.xlsx/.xls/.csv), Word (.docx), PDF ya da fotoğraf (.jpg/.png) dene.';
            return;
          }
          if(taEl) taEl.value = lines.join('\n');
          statusEl.textContent = lines.length ? `${lines.length} satır bulundu — lütfen kontrol edip düzelt.` : 'Hiçbir şey bulunamadı, listeyi elle yapıştırabilirsin.';
        }catch(err){
          console.error(err);
          statusEl.textContent = 'Okunamadı: ' + (err && err.message ? err.message : err);
        }
      })();
      break;
    }
    case 'commitImport': {
      const ta = document.getElementById('importTextarea');
      const lines = ta ? ta.value.split('\n').map(l=>l.trim()).filter(Boolean) : [];
      let added = 0;
      lines.forEach(line=>{
        const m = line.match(/^(\d+)\s*-\s*(.+)$/);
        let no=null, name;
        if(m){ no=Number(m[1]); name=m[2].trim(); } else { name=line.trim(); }
        if(!name) return;
        cls.students.push({id:uid(), name, number:no, grades:{sinav1:null,sinav2:null,sozlu1:null,sozlu2:null}});
        added++;
      });
      if(added){ saveDB(); }
      closeModal();
      if(added) alert(`${added} öğrenci eklendi.`);
      renderMain();
      break;
    }

    case 'closeModal': closeModal(); break;

    case 'exportData': {
      const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a2 = document.createElement('a');
      a2.href = url; a2.download = `ogretmen-defteri-yedek-${todayISO()}.json`;
      document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
      URL.revokeObjectURL(url);
      break;
    }
    case 'importData': {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = 'application/json';
      input.onchange = () => {
        const file = input.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try{
            const parsed = JSON.parse(reader.result);
            if(!parsed.classes) throw new Error('geçersiz');
            if(confirm('Mevcut tüm veriler bu yedekle değiştirilecek. Emin misin?')){
              db = parsed; migrateDB(); saveDB(); state.view='home'; render();
            }
          }catch(e){ alert('Dosya okunamadı. Geçerli bir yedek dosyası seçtiğinden emin ol.'); }
        };
        reader.readAsText(file);
      };
      input.click();
      break;
    }
  }
}

/* ---------- FORM SUBMITS ---------- */
function handleSubmit(form, ev){
  ev.preventDefault();
  if(form.dataset.submitted === '1') return;
  form.dataset.submitted = '1';
  form.querySelectorAll('button[type="submit"]').forEach(b=>{ b.disabled = true; });
  const a = form.dataset.action;
  const fd = new FormData(form);
  const cls = form.dataset.id ? getClass(form.dataset.id) : null;
  switch(a){
    case 'submitNewClass': {
      const c = newClassObj(fd.get('name').trim());
      db.classes.push(c); saveDB(); closeModal();
      state.view='class'; state.classId=c.id; state.classTab='ogrenciler'; render();
      break;
    }
    case 'submitRenameClass': cls.name = fd.get('name').trim(); saveDB(); closeModal(); render(); break;
    case 'submitAddStudent':
      cls.students.push({
        id:uid(), name:fd.get('name').trim(), number:fd.get('number')?Number(fd.get('number')):null,
        grades:{sinav1:null, sinav2:null, sozlu1:null, sozlu2:null}
      });
      saveDB(); closeModal(); renderMain(); break;
    case 'submitEditStudent': {
      const s = cls.students.find(s=>s.id===form.dataset.sid);
      s.name = fd.get('name').trim(); s.number = fd.get('number')?Number(fd.get('number')):null;
      saveDB(); closeModal(); renderMain(); break;
    }
    case 'submitLessonNote':
      cls.notes.push({id:uid(), date:fd.get('date'), text:fd.get('text').trim()});
      saveDB(); closeModal(); renderMain(); break;
    case 'submitEditLessonNote': {
      const n = cls.notes.find(n=>n.id===form.dataset.nid);
      n.date = fd.get('date'); n.text = fd.get('text').trim();
      saveDB(); closeModal(); renderMain(); break;
    }
    case 'submitSeat': {
      const desk = Number(form.dataset.desk), slot = Number(form.dataset.slot);
      const sid = fd.get('studentId') || null;
      cls.seating[desk][slot] = sid;
      saveDB(); closeModal(); renderMain(); break;
    }
    case 'submitReminder':
      cls.reminders.push({id:uid(), date:fd.get('date'), text:fd.get('text').trim(), done:false});
      saveDB(); closeModal(); renderMain(); break;
    case 'submitScheduleItem':
      db.schedule.push({id:uid(), day:fd.get('day'), time:fd.get('time'), classId:fd.get('classId')});
      saveDB(); closeModal(); renderMain(); break;
  }
}

/* ---------- EVENT DELEGATION ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t || t.tagName==='FORM') return;
  if(t.tagName==='INPUT') return;
  handleAction(t.dataset, e);
});
document.addEventListener('change', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  if(t.tagName==='INPUT' && t.type==='text') return;
  handleAction(t.dataset, e);
});
document.addEventListener('input', e=>{
  const t = e.target.closest('[data-action="searchStudents"]');
  if(t) handleAction(t.dataset, e);
});
document.addEventListener('submit', e=>{
  const f = e.target.closest('form[data-action]');
  if(!f) return;
  handleSubmit(f, e);
});

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
